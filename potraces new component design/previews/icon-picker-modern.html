<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potraces — Modern Icon Picker (Solar)</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#F1F0EA; color:#3A3628; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:30px 18px 150px; min-height:100vh; }
  header { max-width:900px; margin:0 auto 8px; }
  h1 { font-size:22px; font-weight:700; letter-spacing:-0.3px; }
  .sub { font-size:13px; color:#6A6656; margin-top:6px; line-height:1.5; }
  code { font-family:ui-monospace,Menlo,monospace; }

  .rows { max-width:900px; margin:22px auto 0; display:flex; flex-direction:column; gap:16px; }
  .row { background:#F4F3ED; border-radius:20px; padding:14px 16px 16px;
    box-shadow:-3px -4px 9px #FFFFFF, 4px 5px 11px #DDDACF; }
  .rname { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .dot { width:10px; height:10px; border-radius:50%; }
  .opts { display:flex; gap:12px; flex-wrap:wrap; }
  .opt { display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; width:70px; }
  .tile { position:relative; width:52px; height:52px; border-radius:15px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,#FCFBF9,#F0EFE9); box-shadow:-3px -4px 8px #FFFFFF, 3px 4px 9px #DEDACE;
    transition:box-shadow .18s, transform .14s; color:var(--c); }
  .opt:hover .tile { transform:translateY(-1px); }
  .opt.sel .tile { box-shadow:inset -2px -3px 7px #FFFFFF, inset 3px 4px 8px #DBD7CB, 0 0 0 2px var(--c); }
  .tile svg { width:28px; height:28px; display:block; }
  .oname { font-size:8.5px; color:#8C876F; font-family:ui-monospace,Menlo,monospace; text-align:center; line-height:1.15; word-break:break-word; max-width:70px; }
  .opt.sel .oname { color:#3A3628; font-weight:700; }

  .picks { position:fixed; left:0; right:0; bottom:0; background:#EEEDE6; border-top:1px solid #DDDACF;
    box-shadow:0 -8px 24px rgba(0,0,0,.08); padding:12px 18px; max-height:34vh; overflow:auto; }
  .picks-inner { max-width:900px; margin:0 auto; }
  .picks h2 { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#6A6656; margin-bottom:8px; }
  .picklist { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#3A3628; line-height:1.8; }
  .picklist b { color:#4F5104; }
</style>
</head>
<body>
  <header>
    <h1>Pick a modern icon per action</h1>
    <p class="sub">10 real Solar (bold-duotone) options each. Tap the one you want per row — choices tally at the bottom so you can read them back to me. All render via <code>react-native-svg</code> (already installed) — no new dependency.</p>
  </header>

  <div class="rows" id="rows"></div>

  <div class="picks"><div class="picks-inner">

    <div class="picklist" id="picklist"></div>
  </div></div>

  const picks = {};
  function render(){
    document.getElementById('rows').innerHTML = ACTIONS.map(a=>{
      const c = COL[a.color];
      const list = DATA[a.key] || [];
      const opts = list.map((o,oi)=>`
        <div class="opt ${oi===(picks[a.key]??0)?'sel':''}" style="--c:${c}" data-k="${a.key}" data-o="${oi}">
          <div class="tile">${o.s}</div>
          <span class="oname">${o.n}</span>
        </div>`).join('');
      return `<div class="row">
        <div class="rname"><span class="dot" style="background:${c}"></span>${a.name}</div>
        <div class="opts">${opts}</div>
      </div>`;
    }).join('');
    document.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
      picks[el.dataset.k]=+el.dataset.o; render(); summary();
    }));
    summary();
  }
  function summary(){
    document.getElementById('picklist').innerHTML = ACTIONS.map(a=>{
      const list=DATA[a.key]||[]; const o=list[picks[a.key]??0];
      return o ? `${a.name}: <b>${o.n}</b>` : `${a.name}: —`;
    }).join('&nbsp;&nbsp;·&nbsp;&nbsp;');
  }
  render();
</script>
